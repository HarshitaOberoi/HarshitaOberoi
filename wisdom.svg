<svg xmlns="http://www.w3.org/2000/svg" width="380" height="140">
    <style>
        .fact-text { font-family: 'Consolas', 'Monaco', monospace; font-size: 13px; fill: #00f2ff; }
    </style>
    
    <!-- Background Card -->
    <rect width="100%" height="100%" fill="#0d1117" rx="6" stroke="#30363d" stroke-width="1" />
    
    <!-- Terminal Header -->
    <rect width="100%" height="32" fill="#161b22" rx="6" />
    <rect y="30" width="100%" height="2" fill="#161b22" /> <!-- Cover bottom corners of header -->
    <line x1="0" y1="32" x2="380" y2="32" stroke="#30363d" stroke-width="1" />
    
    <!-- Dots -->
    <circle cx="20" cy="16" r="5" fill="#ff5f56" />
    <circle cx="36" cy="16" r="5" fill="#ffbd2e" />
    <circle cx="52" cy="16" r="5" fill="#27c93f" />
    
    <text x="70" y="20" font-family="'Inter', sans-serif" font-size="11" fill="#8b949e">wisdom.exe</text>

    <!-- Terminal Body -->
    <g transform="translate(16 60)">
        <!-- Fact 1 -->
        <g opacity="0">
            <text class="fact-text" y="0">&gt; There are 10 types of people:</text>
            <text class="fact-text" y="15">those who understand binary, and those who don't.</text>
            <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.1;0.12;1" dur="48s" begin="0s" repeatCount="indefinite" />
            <animateTransform attributeName="transform" type="translate" values="0 10; 0 0; 0 0; 0 -10; 0 -10" keyTimes="0;0.02;0.1;0.12;1" dur="48s" begin="0s" repeatCount="indefinite" />
        </g>
        
        <!-- Fact 2 -->
        <g opacity="0">
            <text class="fact-text" y="0">&gt; "Artificial Intelligence is no match</text>
            <text class="fact-text" y="15">for natural stupidity."</text>
            <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.1;0.12;1" dur="48s" begin="6s" repeatCount="indefinite" />
            <animateTransform attributeName="transform" type="translate" values="0 10; 0 0; 0 0; 0 -10; 0 -10" keyTimes="0;0.02;0.1;0.12;1" dur="48s" begin="6s" repeatCount="indefinite" />
        </g>

        <!-- Fact 3 -->
        <g opacity="0">
            <text class="fact-text" y="0">&gt; One man's crappy software is</text>
            <text class="fact-text" y="15">another man's full-time job.</text>
            <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.1;0.12;1" dur="48s" begin="12s" repeatCount="indefinite" />
            <animateTransform attributeName="transform" type="translate" values="0 10; 0 0; 0 0; 0 -10; 0 -10" keyTimes="0;0.02;0.1;0.12;1" dur="48s" begin="12s" repeatCount="indefinite" />
        </g>

        <!-- Fact 4 -->
        <g opacity="0">
            <text class="fact-text" y="0">&gt; Git Push Force: The 'because I said so'</text>
            <text class="fact-text" y="15">of programming.</text>
            <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.1;0.12;1" dur="48s" begin="18s" repeatCount="indefinite" />
            <animateTransform attributeName="transform" type="translate" values="0 10; 0 0; 0 0; 0 -10; 0 -10" keyTimes="0;0.02;0.1;0.12;1" dur="48s" begin="18s" repeatCount="indefinite" />
        </g>

        <!-- Fact 5 -->
        <g opacity="0">
            <text class="fact-text" y="0">&gt; Semicolon: A hide and seek champion</text>
            <text class="fact-text" y="15">since 1958.</text>
            <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.1;0.12;1" dur="48s" begin="24s" repeatCount="indefinite" />
            <animateTransform attributeName="transform" type="translate" values="0 10; 0 0; 0 0; 0 -10; 0 -10" keyTimes="0;0.02;0.1;0.12;1" dur="48s" begin="24s" repeatCount="indefinite" />
        </g>

        <!-- Fact 6 -->
        <g opacity="0">
            <text class="fact-text" y="0">&gt; #ItWorksOnMyMachine</text>
            <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.1;0.12;1" dur="48s" begin="30s" repeatCount="indefinite" />
            <animateTransform attributeName="transform" type="translate" values="0 10; 0 0; 0 0; 0 -10; 0 -10" keyTimes="0;0.02;0.1;0.12;1" dur="48s" begin="30s" repeatCount="indefinite" />
        </g>

        <!-- Fact 7 -->
        <g opacity="0">
            <text class="fact-text" y="0">&gt; Real programmers count from 0.</text>
            <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.1;0.12;1" dur="48s" begin="36s" repeatCount="indefinite" />
            <animateTransform attributeName="transform" type="translate" values="0 10; 0 0; 0 0; 0 -10; 0 -10" keyTimes="0;0.02;0.1;0.12;1" dur="48s" begin="36s" repeatCount="indefinite" />
        </g>

        <!-- Fact 8 -->
        <g opacity="0">
            <text class="fact-text" y="0">&gt; I don't always test my code, but when</text>
            <text class="fact-text" y="15">I do, I do it in production.</text>
            <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.1;0.12;1" dur="48s" begin="42s" repeatCount="indefinite" />
            <animateTransform attributeName="transform" type="translate" values="0 10; 0 0; 0 0; 0 -10; 0 -10" keyTimes="0;0.02;0.1;0.12;1" dur="48s" begin="42s" repeatCount="indefinite" />
        </g>
    </g>
</svg>
