<svg width="500" height="200" viewBox="0 0 500 200" xmlns="http://www.w3.org/2000/svg">
<style>
.label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #c9d1d9; font-size: 14px; font-weight: 600; }
.value { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #00f2ff; font-size: 14px; font-weight: 700; text-anchor: end; }
.header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #00f2ff; font-size: 18px; font-weight: 700; }
</style>
<rect width="500" height="200" fill="#0d1117" rx="10" ry="10" />
<text x="25" y="35" class="header">GitHub Stats</text>
<text x="25" y="70" class="label">★ Total Stars</text>
<text x="200" y="70" class="value">12+</text>
<text x="25" y="95" class="label">Git Commits (2025)</text>
<text x="200" y="95" class="value">180+</text>
<text x="25" y="120" class="label">🔀 PRs</text>
<text x="200" y="120" class="value">25+</text>
<text x="250" y="70" class="label">⊙ Issues</text>
<text x="425" y="70" class="value">12</text>
<text x="250" y="95" class="label">📦 Contributed to</text>
<text x="425" y="95" class="value">15+</text>
</svg>