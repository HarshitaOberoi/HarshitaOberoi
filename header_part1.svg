<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300">
    <defs>
        <linearGradient id="barGrad" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0%" stop-color="#00f2ff" stop-opacity="0.35"/>
            <stop offset="50%" stop-color="#00f2ff" stop-opacity="0.1"/>
            <stop offset="100%" stop-color="#00f2ff" stop-opacity="0.0"/>
        </linearGradient>
        <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="1.5" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
        <clipPath id="circleClip">
            <circle cx="50" cy="50" r="50" />
        </clipPath>
    </defs>
    
    <!-- Background: Dark Card Layer -->
    <rect width="100%" height="100%" fill="#0d1117" rx="10" ry="10" stroke="#30363d" stroke-width="1" />

    <!-- Animated Bars (Simplified Set) -->
    <g transform="scale(8 3) translate(0 0)" opacity="0.6">
        <rect x="0" y="50" width="0.8" height="50" fill="url(#barGrad)"><animate attributeName="y" values="50;80;50" dur="2s" repeatCount="indefinite" /><animate attributeName="height" values="50;20;50" dur="2s" repeatCount="indefinite" /></rect>
        <rect x="2" y="40" width="0.8" height="60" fill="url(#barGrad)"><animate attributeName="y" values="40;70;40" dur="3s" repeatCount="indefinite" /><animate attributeName="height" values="60;30;60" dur="3s" repeatCount="indefinite" /></rect>
        <rect x="4" y="60" width="0.8" height="40" fill="url(#barGrad)"><animate attributeName="y" values="60;90;60" dur="2.5s" repeatCount="indefinite" /><animate attributeName="height" values="40;10;40" dur="2.5s" repeatCount="indefinite" /></rect>
        <rect x="6" y="30" width="0.8" height="70" fill="url(#barGrad)"><animate attributeName="y" values="30;60;30" dur="4s" repeatCount="indefinite" /><animate attributeName="height" values="70;40;70" dur="4s" repeatCount="indefinite" /></rect>
        <rect x="8" y="55" width="0.8" height="45" fill="url(#barGrad)"><animate attributeName="y" values="55;85;55" dur="2.2s" repeatCount="indefinite" /><animate attributeName="height" values="45;15;45" dur="2.2s" repeatCount="indefinite" /></rect>
        <rect x="10" y="45" width="0.8" height="55" fill="url(#barGrad)"><animate attributeName="y" values="45;75;45" dur="3.1s" repeatCount="indefinite" /><animate attributeName="height" values="55;25;55" dur="3.1s" repeatCount="indefinite" /></rect>
        <rect x="12" y="65" width="0.8" height="35" fill="url(#barGrad)"><animate attributeName="y" values="65;95;65" dur="2.8s" repeatCount="indefinite" /><animate attributeName="height" values="35;5;35" dur="2.8s" repeatCount="indefinite" /></rect>
        <rect x="14" y="35" width="0.8" height="65" fill="url(#barGrad)"><animate attributeName="y" values="35;65;35" dur="3.5s" repeatCount="indefinite" /><animate attributeName="height" values="65;35;65" dur="3.5s" repeatCount="indefinite" /></rect>
        <rect x="16" y="50" width="0.8" height="50" fill="url(#barGrad)"><animate attributeName="y" values="50;80;50" dur="2.1s" repeatCount="indefinite" /><animate attributeName="height" values="50;20;50" dur="2.1s" repeatCount="indefinite" /></rect>
        <rect x="18" y="40" width="0.8" height="60" fill="url(#barGrad)"><animate attributeName="y" values="40;70;40" dur="2.9s" repeatCount="indefinite" /><animate attributeName="height" values="60;30;60" dur="2.9s" repeatCount="indefinite" /></rect>
        <rect x="20" y="60" width="0.8" height="40" fill="url(#barGrad)"><animate attributeName="y" values="60;90;60" dur="2.4s" repeatCount="indefinite" /><animate attributeName="height" values="40;10;40" dur="2.4s" repeatCount="indefinite" /></rect>
        <rect x="22" y="30" width="0.8" height="70" fill="url(#barGrad)"><animate attributeName="y" values="30;60;30" dur="3.8s" repeatCount="indefinite" /><animate attributeName="height" values="70;40;70" dur="3.8s" repeatCount="indefinite" /></rect>
