        <rect x="26" y="45" width="0.8" height="55" fill="url(#barGrad)"><animate attributeName="y" values="45;75;45" dur="3.2s" repeatCount="indefinite" /><animate attributeName="height" values="55;25;55" dur="3.2s" repeatCount="indefinite" /></rect>
        <rect x="28" y="65" width="0.8" height="35" fill="url(#barGrad)"><animate attributeName="y" values="65;95;65" dur="2.7s" repeatCount="indefinite" /><animate attributeName="height" values="35;5;35" dur="2.7s" repeatCount="indefinite" /></rect>
        <rect x="30" y="35" width="0.8" height="65" fill="url(#barGrad)"><animate attributeName="y" values="35;65;35" dur="3.6s" repeatCount="indefinite" /><animate attributeName="height" values="65;35;65" dur="3.6s" repeatCount="indefinite" /></rect>
        <rect x="32" y="50" width="0.8" height="50" fill="url(#barGrad)"><animate attributeName="y" values="50;80;50" dur="2s" repeatCount="indefinite" /><animate attributeName="height" values="50;20;50" dur="2s" repeatCount="indefinite" /></rect>
        <rect x="34" y="40" width="0.8" height="60" fill="url(#barGrad)"><animate attributeName="y" values="40;70;40" dur="3s" repeatCount="indefinite" /><animate attributeName="height" values="60;30;60" dur="3s" repeatCount="indefinite" /></rect>
        <rect x="36" y="60" width="0.8" height="40" fill="url(#barGrad)"><animate attributeName="y" values="60;90;60" dur="2.5s" repeatCount="indefinite" /><animate attributeName="height" values="40;10;40" dur="2.5s" repeatCount="indefinite" /></rect>
        <rect x="38" y="30" width="0.8" height="70" fill="url(#barGrad)"><animate attributeName="y" values="30;60;30" dur="4s" repeatCount="indefinite" /><animate attributeName="height" values="70;40;70" dur="4s" repeatCount="indefinite" /></rect>
        <rect x="40" y="55" width="0.8" height="45" fill="url(#barGrad)"><animate attributeName="y" values="55;85;55" dur="2.2s" repeatCount="indefinite" /><animate attributeName="height" values="45;15;45" dur="2.2s" repeatCount="indefinite" /></rect>
        <rect x="42" y="45" width="0.8" height="55" fill="url(#barGrad)"><animate attributeName="y" values="45;75;45" dur="3.1s" repeatCount="indefinite" /><animate attributeName="height" values="55;25;55" dur="3.1s" repeatCount="indefinite" /></rect>
        <rect x="44" y="65" width="0.8" height="35" fill="url(#barGrad)"><animate attributeName="y" values="65;95;65" dur="2.8s" repeatCount="indefinite" /><animate attributeName="height" values="35;5;35" dur="2.8s" repeatCount="indefinite" /></rect>
        <rect x="46" y="35" width="0.8" height="65" fill="url(#barGrad)"><animate attributeName="y" values="35;65;35" dur="3.5s" repeatCount="indefinite" /><animate attributeName="height" values="65;35;65" dur="3.5s" repeatCount="indefinite" /></rect>
        <rect x="48" y="50" width="0.8" height="50" fill="url(#barGrad)"><animate attributeName="y" values="50;80;50" dur="2.1s" repeatCount="indefinite" /><animate attributeName="height" values="50;20;50" dur="2.1s" repeatCount="indefinite" /></rect>
        <rect x="50" y="40" width="0.8" height="60" fill="url(#barGrad)"><animate attributeName="y" values="40;70;40" dur="2.9s" repeatCount="indefinite" /><animate attributeName="height" values="60;30;60" dur="2.9s" repeatCount="indefinite" /></rect>
        <!-- And so on... simplified to fit -->
    </g>

    <g transform="translate(30 30)">
